name: CI + deploy
# Every push and PR: full test suite (unit, parser parity, phone E2E in headless Chromium).
# Push to `dev` with green tests: build the PWA and publish it to `main`, which GitHub Pages serves.
on:
  push:
    branches: [dev, "feat/**"]
  pull_request:
    branches: [dev]
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python -m unittest -q
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: LIFEOS_DIST="$PWD/site-build" python scripts/build_pwa.py
      - uses: actions/checkout@v4
        with: {ref: main, path: site}
      - name: Publish build to main
        run: |
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r site-build/. site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing changed" && exit 0
          git commit -m "Deploy ${GITHUB_SHA::7} from dev"
          git push origin main
